<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WR Calculator Pro</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #1e1e2f, #0f172a);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* CARD */
.box {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 25px;
  width: 320px;
  color: white;
  box-shadow: 
    0 10px 30px rgba(0,0,0,0.5),
    0 0 20px rgba(0,255,255,0.15);
  animation: fadeIn 0.8s ease;
  transition: 0.3s;
}

.box:hover {
  transform: translateY(-5px);
}

h2 {
  text-align: center;
  margin-bottom: 15px;
  background: linear-gradient(45deg, cyan, lightblue);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* INPUT */
input, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: white;
  transition: 0.25s;
}

input::placeholder {
  color: rgba(255,255,255,0.5);
}

input:focus, select:focus {
  background: rgba(255,255,255,0.15);
  transform: scale(1.03);
  box-shadow: 0 0 10px rgba(0,255,255,0.4);
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(45deg, cyan, blue);
  font-weight: bold;
  color: white;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 0 10px rgba(0,255,255,0.4);
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(0,255,255,0.8);
}

/* HASIL */
.hasil {
  margin-top: 15px;
  text-align: center;
  opacity: 0;
  transform: translateY(10px);
  transition: 0.5s;
}

.hasil.show {
  opacity: 1;
  transform: translateY(0);
}

.hasil b {
  color: cyan;
  text-shadow: 0 0 10px cyan;
}

/* ANIMASI */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>

</head>

<body>

<div class="box">
  <h2>WR Calculator 🔥</h2>

  <input type="number" id="match" placeholder="Total Match">
  <input type="number" id="wr" placeholder="WR Sekarang (%)">
  <input type="number" id="target" placeholder="Target WR (%)">

  <select id="mode">
    <option value="game">🎮 Mode Game</option>
    <option value="real">📊 Mode Akurat</option>
  </select>

  <button onclick="hitung()">Hitung</button>

  <div class="hasil" id="output"></div>
</div>

<script>
function hitung() {
  let totalMatch = parseFloat(document.getElementById("match").value);
  let wrSekarang = parseFloat(document.getElementById("wr").value);
  let targetWR = parseFloat(document.getElementById("target").value);
  let mode = document.getElementById("mode").value;
  let output = document.getElementById("output");

  if (!totalMatch || !wrSekarang || !targetWR) {
    output.classList.add("show");
    output.innerHTML = "Isi semua dulu!";
    return;
  }

  let currentWR = wrSekarang / 100;
  let target = targetWR / 100;
  let win = currentWR * totalMatch;

  let winTambahan = 0;

  if (mode === "real") {
    let x = (target * totalMatch - win) / (1 - target);
    winTambahan = Math.ceil(x);
  } else {
    while (true) {
      let totalBaru = totalMatch + winTambahan;
      let winBaru = win + winTambahan;
      let wrBaru = (winBaru / totalBaru * 100);

      if (wrBaru.toFixed(1) >= targetWR) break;
      winTambahan++;
    }
  }

  let totalBaru = totalMatch + winTambahan;
  let winBaru = win + winTambahan;
  let wrBaru = (winBaru / totalBaru * 100);

  output.innerHTML = `
    🔥 Butuh <b>${winTambahan} win tanpa kalah</b><br>
    📊 Total Match: <b>${totalBaru}</b><br>
    🎯 WR Akhir: <b>${wrBaru.toFixed(2)}%</b>
  `;

  output.classList.add("show");
}
</script>

</body>
</html>
